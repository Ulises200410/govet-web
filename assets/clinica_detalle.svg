  <path d="M808 430c56-6 88-34 96-72" fill="none" stroke="#5A6B80" stroke-width="26" stroke-linecap="round"/>

  <!-- planta -->
  <rect x="946" y="402" width="74" height="72" rx="8" fill="#1B2F49" stroke="#2C4562" stroke-width="3"/>
