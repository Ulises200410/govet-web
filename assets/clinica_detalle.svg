<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo2">
  <title id="titulo2">Ilustración de un rincón de la clínica</title>
  <defs>
    <pattern id="trama2" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#F2B24C" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B24C" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F2B24C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0B1320"/>
  <rect width="1200" height="675" fill="url(#trama2)"/>
  <path d="M760 0l240 0-160 470H520z" fill="url(#luz)"/>

  <!-- lámpara -->
  <path d="M868 60v150" stroke="#2C4562" stroke-width="8"/>
  <path d="M788 210h160l-34-78h-92z" fill="#1B2F49" stroke="#2C4562" stroke-width="3"/>
  <ellipse cx="868" cy="212" rx="80" ry="12" fill="#F2B24C" opacity=".55"/>

  <!-- repisa -->
  <rect x="120" y="474" width="960" height="20" rx="8" fill="#2C4562"/>
  <rect x="148" y="494" width="18" height="120" fill="#1B2F49"/>
  <rect x="1034" y="494" width="18" height="120" fill="#1B2F49"/>

  <!-- maletín -->
  <rect x="212" y="352" width="212" height="122" rx="14" fill="#1B2F49" stroke="#2C4562" stroke-width="3"/>
  <path d="M270 352v-20c0-18 14-30 32-30h32c18 0 32 12 32 30v20"
        fill="none" stroke="#2C4562" stroke-width="12"/>
  <rect x="300" y="396" width="36" height="36" rx="6" fill="#3DD6C0"/>
  <path d="M318 388v52M292 414h52" stroke="#0B1320" stroke-width="7" stroke-linecap="round"/>
  <rect x="226" y="446" width="184" height="8" rx="4" fill="#2C4562"/>

  <!-- gato -->
  <ellipse cx="690" cy="428" rx="150" ry="50" fill="#5A6B80"/>
  <path d="M566 420c-14-40 0-70 26-70s34 30 22 66z" fill="#5A6B80"/>
  <path d="M578 360c-20-28-10-52 6-52 12 0 22 16 24 36z" fill="#5A6B80"/>
  <path d="M624 358c18-26 36-30 48-20 8 8-2 28-18 38z" fill="#5A6B80"/>
  <ellipse cx="646" cy="390" rx="60" ry="48" fill="#72859C"/>
  <path d="M600 362l10-34 24 24M694 360l-8-32-24 22" fill="#72859C"/>
  <circle cx="624" cy="386" r="6" fill="#0B1320"/>
  <circle cx="670" cy="386" r="6" fill="#0B1320"/>
