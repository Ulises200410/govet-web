  <path d="M666 430c-38 6-56 22-56 40" fill="none" stroke="#E8C9A0" stroke-width="20" stroke-linecap="round"/>

  <!-- detalle ambiental -->
  <circle cx="212" cy="196" r="34" fill="#F2B24C" opacity=".9"/>
  <path d="M212 178v36M194 196h36" stroke="#0B1320" stroke-width="6" stroke-linecap="round"/>
  <rect x="108" y="266" width="6" height="204" rx="3" fill="#2C4562"/>
  <circle cx="111" cy="250" r="16" fill="#3DD6C0" opacity=".8"/>
